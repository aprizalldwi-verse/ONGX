services:
  postgres:
    image: postgres:16-alpine
    container_name: ongx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ongx
      POSTGRES_PASSWORD: ongx
      POSTGRES_DB: ongx
    ports:
      - "5432:5432"
    volumes:
      - ongx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ongx -d ongx"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ongx-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ongx-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ongx-pgdata:
  ongx-redisdata:
